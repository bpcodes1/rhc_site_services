<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Fonts are self-hosted from /fonts, declared in src/fonts.css. The
         Google Fonts stylesheet that used to live here was render-blocking and
         needed two extra third-party connections before any text could be
         styled. Measured 2026-08-14, its swap was the ONLY cause of layout
         shift on the site: /storage-containers scored 0.2964 CLS (POOR) with
         it and 0.0000 with it blocked. Do not reintroduce it.
         These are variable fonts: one file per family covers every weight, so
         preloading two files covers all headline and body text. JetBrains Mono
         is not preloaded because it only sets small labels. -->
    <link rel="preload" href="/fonts/archivo-narrow.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/public-sans.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Title and description tags are deliberately absent: each page declares
         its own and prerendering writes them into every built file. Defaults
         here would leave two of each, and the generic one would win. -->
    <meta property="og:title" content="RHC Site Services" />
    <meta property="og:description" content="Porta potty, restroom trailer, shower trailer, temporary fencing, and storage container rentals across Oregon and Washington. Hard delivery windows. No surprise fees." />
    <meta property="og:image" content="https://rhcsiteservice.com/preview.webp" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://rhcsiteservice.com/" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RHC Site Services" />
    <meta name="twitter:description" content="Porta potty, restroom trailer, shower trailer, temporary fencing, and storage container rentals across Oregon and Washington. Hard delivery windows. No surprise fees." />
    <meta name="twitter:image" content="https://rhcsiteservice.com/preview.webp" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
